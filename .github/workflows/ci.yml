# CI: go test, go vet, govulncheck.
# Action SHAs pinned where resolved from public release notes; if a SHA drifts,
# re-resolve with: gh api repos/OWNER/REPO/git/ref/tags/TAG --jq .object.sha
# (GitHub API was rate-limited during scaffold; verify SHAs before relying on them in a locked-down org.)
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0c52d547c9bc32b1aa3301fd7a9cb496313a4491 # v5.0.0
        with:
          go-version: "1.22.x"
          cache: true

      - name: go test
        run: go test ./...

      - name: go vet
        run: go vet ./...

      - name: govulncheck
        # Install tool explicitly so we do not depend on composite-action nested pins.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
